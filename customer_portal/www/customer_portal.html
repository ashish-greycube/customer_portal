<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Refteck Customer Portal</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link
        href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap"
        rel="stylesheet">
    <style>
        body {
            margin: 0;
            background: oklch(98% 0.004 250);
        }

        * {
            box-sizing: border-box;
            font-family: 'Public Sans', Helvetica, Arial, sans-serif;
        }

        ::placeholder {
            color: oklch(60% 0.01 250);
        }

        a {
            color: oklch(45% 0.13 250);
            text-decoration: none;
        }

        a:hover {
            color: oklch(38% 0.14 250);
        }

        input:focus,
        textarea:focus {
            outline: 2px solid oklch(68% 0.16 55);
            outline-offset: 1px;
        }

        button {
            font-family: inherit;
        }

        @keyframes spin {
            from {
                transform: rotate(0deg)
            }

            to {
                transform: rotate(360deg)
            }
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(6px)
            }

            to {
                opacity: 1;
                transform: translateY(0)
            }
        }
    </style>
</head>

<body>
    <div id="root"></div>
    <script>
        const LOGO = "https://www.refteck.com/wp-content/uploads/2025/04/cropped-cropped-Refteck_Logo_2025.png";
        const ACCENT = '#d97706';
        const CURRENCY = 'USD';
        const SHOW_OCR_CONFIDENCE = true;

        const state = {
            screen: 'signin',
            signinForm: true,
            email: '',
            uploadStep: 'idle',
            header: { prNumber: 'PR-2026-00842', date: '2026-07-14', requester: 'James Dalton', department: 'Plant Maintenance', vendor: 'Flowserve Corp.' },
            lineItems: [],
            syncing: false,
            approvals: {},
        };

        const MOCK_LINES = [
            { id: 1, description: 'Ball Valve 4in 300# Flanged', qty: '12', uom: 'EA', unitPrice: 340, confidence: 0.97 },
            { id: 2, description: 'Mechanical Seal Kit - Type 21', qty: '6', uom: 'EA', unitPrice: 512, confidence: 0.94 },
            { id: 3, description: 'Centrifugal Pump Impeller', qty: '3', uom: 'EA', unitPrice: 1180, confidence: 0.89 },
            { id: 4, description: 'Pressure Gauge 0-100 PSI', qty: '20', uom: 'EA', unitPrice: 48, confidence: 0.99 },
            { id: 5, description: 'Gasket Set - Spiral Wound', qty: '30', uom: 'EA', unitPrice: 22, confidence: 0.91 },
        ];

        const PR_ROWS = [
            { number: 'PR-88231', requester: 'A. Whitfield', department: 'Refining', value: 24500, date: 'Jul 15', status: 'Synced' },
            { number: 'PR-88229', requester: 'M. Osei', department: 'Pipelines', value: 8120, date: 'Jul 15', status: 'Pending Review' },
            { number: 'PR-88214', requester: 'James Dalton', department: 'Plant Maintenance', value: 41200, date: 'Jul 14', status: 'Approved' },
            { number: 'PR-88198', requester: 'R. Novak', department: 'Facilities', value: 3050, date: 'Jul 13', status: 'Synced' },
            { number: 'PR-88187', requester: 'A. Whitfield', department: 'Refining', value: 15800, date: 'Jul 12', status: 'Rejected' },
            { number: 'PR-88172', requester: 'M. Osei', department: 'Pipelines', value: 6600, date: 'Jul 11', status: 'On Hold' },
            { number: 'PR-88160', requester: 'R. Novak', department: 'Facilities', value: 12900, date: 'Jul 10', status: 'Cancelled' },
            { number: 'PR-88145', requester: 'James Dalton', department: 'Plant Maintenance', value: 27700, date: 'Jul 09', status: 'Synced' },
        ];

        const APPROVAL_ROWS_BASE = [
            { id: 1, title: 'PR-88229 — Instrumentation spares', meta: 'Oracle · M. Osei · Pipelines', value: 8120 },
            { id: 2, title: 'PR-88231 — Refinery valve replacements', meta: 'SAP · A. Whitfield · Refining', value: 24500 },
            { id: 3, title: 'PR-88198 — Facilities HVAC parts', meta: 'Dynamics · R. Novak · Facilities', value: 3050 },
            { id: 4, title: 'PR-2026-00842 — Uploaded PR (pending OCR review)', meta: 'Manual upload · James Dalton', value: 8794 },
        ];

        const REPORT_ROWS = [
            { po: 'PO-51120', vendor: 'Flowserve Corp.', value: 24500, promised: 'Jun 28', delivered: 'Jun 27', onTime: true },
            { po: 'PO-51104', vendor: 'Emerson Process', value: 8120, promised: 'Jun 22', delivered: 'Jun 25', onTime: false },
            { po: 'PO-51092', vendor: 'Parker Hannifin', value: 41200, promised: 'Jun 18', delivered: 'Jun 18', onTime: true },
            { po: 'PO-51071', vendor: 'SKF Group', value: 3050, promised: 'Jun 10', delivered: 'Jun 09', onTime: true },
            { po: 'PO-51050', vendor: 'Weir Group', value: 15800, promised: 'Jun 05', delivered: 'Jun 11', onTime: false },
            { po: 'PO-51033', vendor: 'Flowserve Corp.', value: 6600, promised: 'May 30', delivered: 'May 29', onTime: true },
        ];

        function fmt(n) {
            const sym = { USD: '$', EUR: '€', GBP: '£' }[CURRENCY] || '$';
            return sym + Number(n).toLocaleString();
        }
        function badgeStyle(bg, fg) {
            return `display:inline-block;padding:4px 10px;border-radius:6px;background:${bg};color:${fg};font-size:11.5px;font-weight:700;`;
        }
        function esc(str) {
            return String(str).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
        }

        function setState(patch) { Object.assign(state, patch); render(); }

        function renderSignin() {
            const body = state.signinForm ? `
    <div>
      <div style="font-size:24px;font-weight:700;margin-bottom:6px;">Sign in</div>
      <div style="font-size:14px;color:oklch(50% 0.012 250);margin-bottom:28px;">Enter your work email and we'll send a one-time sign-in link.</div>
      <div style="font-size:12px;font-weight:600;color:oklch(40% 0.012 250);margin-bottom:6px;">Work email</div>
      <input id="emailInput" type="email" value="${esc(state.email)}" placeholder="name@company.com" style="width:100%;padding:13px 14px;border:1px solid oklch(88% 0.008 250);border-radius:8px;font-size:14px;margin-bottom:18px;"/>
      <button id="sendLinkBtn" style="width:100%;padding:14px;border:none;border-radius:8px;background:oklch(28% 0.045 250);color:#fff;font-weight:700;font-size:14px;cursor:pointer;">Send sign-in link</button>
      <div style="display:flex;align-items:center;gap:10px;margin:22px 0;">
        <div style="flex:1;height:1px;background:oklch(90% 0.008 250);"></div>
        <div style="font-size:11px;color:oklch(60% 0.01 250);">SECURE ACCESS</div>
        <div style="flex:1;height:1px;background:oklch(90% 0.008 250);"></div>
      </div>
      <div style="font-size:12px;color:oklch(55% 0.012 250);line-height:1.6;">No account yet? Contact your Refteck account manager to be provisioned as a buyer on this portal.</div>
    </div>` : `
    <div style="animation:fadeIn 0.35s ease;">
      <div style="width:56px;height:56px;border-radius:50%;background:oklch(95% 0.03 150);display:flex;align-items:center;justify-content:center;margin-bottom:24px;">
        <div style="width:22px;height:12px;border-left:3px solid oklch(62% 0.13 150);border-bottom:3px solid oklch(62% 0.13 150);transform:rotate(-45deg) translate(2px,-2px);"></div>
      </div>
      <div style="font-size:22px;font-weight:700;margin-bottom:10px;">Check your email</div>
      <div style="font-size:14px;color:oklch(50% 0.012 250);line-height:1.6;margin-bottom:28px;">We sent a secure sign-in link to <strong style="color:oklch(20% 0.01 250);">${esc(state.email || 'you@company.com')}</strong>. Click it to access your portal — no password needed.</div>
      <button id="enterPortalBtn" style="width:100%;padding:14px;border:none;border-radius:8px;background:oklch(68% 0.16 55);color:oklch(20% 0.05 55);font-weight:700;font-size:14px;cursor:pointer;">Continue to Portal (demo)</button>
      <div style="text-align:center;margin-top:16px;"><a href="#" id="backToFormLink" style="font-size:13px;">Use a different email</a></div>
    </div>`;

            return `
  <div style="display:grid;grid-template-columns:44% 56%;min-height:100vh;">
    <div style="background:linear-gradient(160deg, oklch(24% 0.045 250), oklch(34% 0.05 250));display:flex;flex-direction:column;justify-content:space-between;padding:56px;">
      <div style="display:flex;align-items:center;gap:12px;">
        <img src="${LOGO}" style="height:40px;width:auto;border-radius:6px;background:#fff;padding:4px 8px;object-fit:contain;"/>
      </div>
      <div style="max-width:420px;">
        <div style="color:oklch(85% 0.02 250);font-size:13px;font-weight:600;letter-spacing:0.08em;text-transform:uppercase;margin-bottom:14px;">Customer Portal</div>
        <div style="color:#fff;font-size:34px;font-weight:700;line-height:1.25;margin-bottom:16px;text-wrap:pretty;">Global MRO &amp; procurement, tracked from request to delivery.</div>
        <div style="color:oklch(80% 0.02 250);font-size:15px;line-height:1.6;">Submit requisitions, watch approvals move, and see every order synced straight from your ERP.</div>
      </div>
      <div style="color:oklch(65% 0.02 250);font-size:12px;">© 2026 Refteck Solutions. All rights reserved.</div>
    </div>
    <div style="display:flex;align-items:center;justify-content:center;padding:40px;">
      <div style="width:100%;max-width:380px;">${body}</div>
    </div>
  </div>`;
        }

        function navIcon(type, color) {
            if (type === 'grid') return `<div style="width:14px;height:14px;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:2px;">
    <div style="background:${color};border-radius:2px;"></div><div style="background:${color};border-radius:2px;"></div>
    <div style="background:${color};border-radius:2px;"></div><div style="background:${color};border-radius:2px;"></div></div>`;
            if (type === 'list') return `<div style="width:14px;display:flex;flex-direction:column;gap:3px;">
    <div style="height:2px;background:${color};border-radius:1px;"></div>
    <div style="height:2px;background:${color};border-radius:1px;"></div>
    <div style="height:2px;background:${color};border-radius:1px;width:70%;"></div></div>`;
            if (type === 'upload') return `<div style="position:relative;width:14px;height:14px;">
    <div style="position:absolute;left:5px;top:0;width:0;height:0;border-left:4px solid transparent;border-right:4px solid transparent;border-bottom:6px solid ${color};"></div>
    <div style="position:absolute;left:6px;top:5px;width:2px;height:6px;background:${color};"></div>
    <div style="position:absolute;left:2px;bottom:0;width:10px;height:2px;background:${color};border-radius:1px;"></div></div>`;
            if (type === 'chart') return `<div style="width:14px;height:14px;display:flex;align-items:flex-end;gap:2px;">
    <div style="width:3px;height:6px;background:${color};border-radius:1px;"></div>
    <div style="width:3px;height:10px;background:${color};border-radius:1px;"></div>
    <div style="width:3px;height:14px;background:${color};border-radius:1px;"></div></div>`;
            return '';
        }

        const NAV_DEFS = [
            { key: 'dashboard', label: 'Dashboard', icon: 'grid' },
            { key: 'prlist', label: 'Purchase Requisitions', icon: 'list' },
            { key: 'upload', label: 'Upload PR', icon: 'upload' },
            { key: 'reports', label: 'Reports', icon: 'chart' },
        ];

        function renderSidebar() {
            const items = NAV_DEFS.map(n => {
                const active = state.screen === n.key;
                const iconColor = active ? ACCENT : 'oklch(70% 0.02 250)';
                return `<div class="navItem" data-nav="${n.key}" style="display:flex;align-items:center;gap:12px;padding:11px 14px;border-radius:9px;cursor:pointer;margin-bottom:2px;background:${active ? 'oklch(32% 0.05 250)' : 'transparent'};">
      <div style="width:16px;height:16px;display:flex;align-items:center;justify-content:center;flex-shrink:0;">${navIcon(n.icon, iconColor)}</div>
      <div style="font-size:13.5px;font-weight:${active ? '700' : '500'};color:${active ? '#fff' : 'oklch(75% 0.02 250)'};">${n.label}</div>
    </div>`;
            }).join('');
            return `
  <div style="background:oklch(24% 0.045 250);padding:24px 16px;display:flex;flex-direction:column;gap:4px;">
    <div style="display:flex;align-items:center;gap:10px;padding:8px 10px 28px 10px;">
      <img src="${LOGO}" style="height:32px;width:auto;border-radius:6px;background:#fff;padding:3px 6px;object-fit:contain;"/>
    </div>
    ${items}
    <div style="flex:1;"></div>
    <div style="display:flex;align-items:center;gap:10px;padding:14px 10px;border-top:1px solid oklch(35% 0.03 250);margin-top:8px;">
      <div style="width:30px;height:30px;border-radius:50%;background:oklch(45% 0.045 250);color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;">JD</div>
      <div>
        <div style="color:#fff;font-size:13px;font-weight:600;">James Dalton</div>
        <div style="color:oklch(65% 0.02 250);font-size:11px;">Procurement Mgr.</div>
      </div>
    </div>
  </div>`;
        }

        function renderDashboard() {
            const statCards = [
                { label: 'Open PRs', value: '24', delta: '+3 today', deltaStyle: 'font-size:12px;color:oklch(55% 0.012 250);' },
                { label: 'Pending Approval', value: '7', delta: 'needs action', deltaStyle: `font-size:12px;color:${ACCENT};font-weight:600;` },
                { label: 'Approved (MTD)', value: '63', delta: '+12% vs. Jun', deltaStyle: 'font-size:12px;color:oklch(58% 0.13 150);' },
                { label: 'On-time Delivery', value: '94%', delta: '+2 pts', deltaStyle: 'font-size:12px;color:oklch(58% 0.13 150);' },
            ];
            const statCardsHtml = statCards.map(c => `
    <div style="background:#fff;border:1px solid oklch(90% 0.008 250);border-radius:14px;padding:22px;">
      <div style="font-size:12px;font-weight:600;color:oklch(50% 0.012 250);text-transform:uppercase;letter-spacing:0.04em;margin-bottom:12px;">${c.label}</div>
      <div style="display:flex;align-items:baseline;gap:8px;">
        <div style="font-size:30px;font-weight:700;font-family:'IBM Plex Mono',monospace;">${c.value}</div>
        <div style="${c.deltaStyle}">${c.delta}</div>
      </div>
    </div>`).join('');

            const spendVals = [180, 240, 210, 300, 260, 340];
            const months = ['Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul'];
            const maxSpend = Math.max(...spendVals);
            const spendTrendHtml = spendVals.map((v, i) => `
    <div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:8px;height:100%;justify-content:flex-end;">
      <div style="font-size:11px;font-family:'IBM Plex Mono',monospace;color:oklch(50% 0.012 250);">$${(v / 10).toFixed(0)}k</div>
      <div style="width:100%;max-width:36px;border-radius:6px 6px 0 0;background:${i === spendVals.length - 1 ? ACCENT : 'oklch(85% 0.03 250)'};height:${(v / maxSpend) * 100}%;"></div>
      <div style="font-size:11px;color:oklch(45% 0.012 250);">${months[i]}</div>
    </div>`).join('');

            const statusCounts = { Synced: 38, Approved: 41, 'Pending Review': 11, Error: 4 };
            const statusColors = { Synced: 'oklch(55% 0.13 250)', Approved: 'oklch(58% 0.13 150)', 'Pending Review': 'oklch(70% 0.15 80)', Error: 'oklch(58% 0.18 25)' };
            const total = Object.values(statusCounts).reduce((a, b) => a + b, 0);
            let acc = 0;
            const gradientParts = Object.entries(statusCounts).map(([k, v]) => {
                const start = (acc / total) * 360; acc += v; const end = (acc / total) * 360;
                return `${statusColors[k]} ${start}deg ${end}deg`;
            });
            const donutStyle = `width:120px;height:120px;border-radius:50%;background:conic-gradient(${gradientParts.join(',')});display:flex;align-items:center;justify-content:center;`;
            const legendHtml = Object.entries(statusCounts).map(([label, count]) => `
    <div style="display:flex;align-items:center;gap:8px;padding:5px 0;">
      <div style="width:8px;height:8px;border-radius:50%;background:${statusColors[label]};"></div>
      <div style="font-size:12.5px;color:oklch(30% 0.012 250);flex:1;">${label}</div>
      <div style="font-size:12.5px;font-weight:600;font-family:'IBM Plex Mono',monospace;">${count}</div>
    </div>`).join('');

            const approvalHtml = APPROVAL_ROWS_BASE.map(r => {
                const st = state.approvals[r.id];
                const approveLabel = st === 'approved' ? 'Approved ✓' : 'Approve';
                const approveStyle = `padding:8px 14px;border:none;border-radius:7px;background:${st === 'approved' ? 'oklch(90% 0.05 150)' : ACCENT};color:${st === 'approved' ? 'oklch(35% 0.1 150)' : '#fff'};font-size:12.5px;font-weight:600;cursor:pointer;`;
                return `<div style="display:flex;align-items:center;gap:16px;padding:14px 0;border-top:1px solid oklch(93% 0.006 250);">
      <div style="flex:1;">
        <div style="font-size:13.5px;font-weight:600;">${r.title}</div>
        <div style="font-size:12px;color:oklch(50% 0.012 250);margin-top:2px;">${r.meta}</div>
      </div>
      <div style="font-size:13.5px;font-weight:600;font-family:'IBM Plex Mono',monospace;width:100px;text-align:right;">${fmt(r.value)}</div>
      <button class="approveBtn" data-id="${r.id}" style="${approveStyle}">${approveLabel}</button>
      <button class="rejectBtn" data-id="${r.id}" style="padding:8px 14px;border:1px solid oklch(88% 0.01 25);border-radius:7px;background:#fff;color:oklch(50% 0.16 25);font-size:12.5px;font-weight:600;cursor:pointer;">Reject</button>
    </div>`;
            }).join('');

            return `
  <div style="animation:fadeIn 0.3s ease;">
    <div style="display:flex;align-items:baseline;justify-content:space-between;margin-bottom:28px;">
      <div>
        <div style="font-size:26px;font-weight:700;">Good morning, James</div>
        <div style="font-size:14px;color:oklch(50% 0.012 250);margin-top:4px;">Here's how your requisitions are moving today.</div>
      </div>
      <div style="font-size:12px;color:oklch(55% 0.012 250);font-family:'IBM Plex Mono',monospace;">Last synced 6 min ago</div>
    </div>
    <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:20px;margin-bottom:28px;">${statCardsHtml}</div>
    <div style="display:grid;grid-template-columns:1.6fr 1fr;gap:20px;margin-bottom:20px;">
      <div style="background:#fff;border:1px solid oklch(90% 0.008 250);border-radius:14px;padding:26px;">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:22px;">
          <div style="font-size:15px;font-weight:700;">Spend trend</div>
          <div style="font-size:12px;color:oklch(50% 0.012 250);font-family:'IBM Plex Mono',monospace;">${CURRENCY} · last 6 months</div>
        </div>
        <div style="display:flex;align-items:flex-end;gap:18px;height:160px;">${spendTrendHtml}</div>
      </div>
      <div style="background:#fff;border:1px solid oklch(90% 0.008 250);border-radius:14px;padding:26px;">
        <div style="font-size:15px;font-weight:700;margin-bottom:20px;">PR status</div>
        <div style="display:flex;justify-content:center;margin-bottom:20px;">
          <div style="${donutStyle}">
            <div style="width:70px;height:70px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;flex-direction:column;">
              <div style="font-size:20px;font-weight:700;font-family:'IBM Plex Mono',monospace;">94</div>
              <div style="font-size:9px;color:oklch(50% 0.012 250);">TOTAL</div>
            </div>
          </div>
        </div>
        ${legendHtml}
      </div>
    </div>
    <div style="background:#fff;border:1px solid oklch(90% 0.008 250);border-radius:14px;padding:26px;">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;">
        <div style="font-size:15px;font-weight:700;">Awaiting your approval</div>
        <a href="#" id="viewAllPrs" style="font-size:12.5px;font-weight:600;">View all →</a>
      </div>
      ${approvalHtml}
    </div>
  </div>`;
        }

        const STATUS_BADGE_COLORS = {
            Synced: ['oklch(93% 0.02 250)', 'oklch(40% 0.08 250)'],
            Approved: ['oklch(94% 0.04 150)', 'oklch(40% 0.1 150)'],
            'Pending Review': ['oklch(96% 0.05 85)', 'oklch(48% 0.13 80)'],
            'On Hold': ['oklch(95% 0.03 60)', 'oklch(48% 0.12 55)'],
            Cancelled: ['oklch(93% 0.006 250)', 'oklch(45% 0.012 250)'],
            Rejected: ['oklch(95% 0.04 25)', 'oklch(48% 0.16 25)'],
        };

        function renderPrList() {
            const cols = '1.2fr 1.3fr 1.1fr 1fr 24px 1fr 1fr';
            const rowsHtml = PR_ROWS.map(r => `
    <div style="display:grid;grid-template-columns:${cols};padding:16px 20px;border-bottom:1px solid oklch(94% 0.006 250);align-items:center;">
      <div style="font-size:13px;font-weight:600;font-family:'IBM Plex Mono',monospace;">${r.number}</div>
      <div style="font-size:13px;">${r.requester}</div>
      <div style="font-size:13px;color:oklch(45% 0.012 250);">${r.department}</div>
      <div style="font-size:13px;font-weight:600;font-family:'IBM Plex Mono',monospace;text-align:right;padding-right:16px;">${fmt(r.value)}</div>
      <div></div>
      <div style="font-size:12.5px;color:oklch(45% 0.012 250);">${r.date}</div>
      <div><div style="${badgeStyle(...(STATUS_BADGE_COLORS[r.status] || STATUS_BADGE_COLORS.Synced))}">${r.status}</div></div>
    </div>`).join('');

            return `
  <div style="animation:fadeIn 0.3s ease;">
    <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:6px;">
      <div>
        <div style="font-size:26px;font-weight:700;">Purchase Requisitions</div>
        <div style="font-size:14px;color:oklch(50% 0.012 250);margin-top:4px;">Automatically synced from your connected ERP systems.</div>
      </div>

        function bindSigninEvents() {
            const emailInput = document.getElementById('emailInput');
            if (emailInput) emailInput.addEventListener('input', e => { state.email = e.target.value; });
            const sendLinkBtn = document.getElementById('sendLinkBtn');
            if (sendLinkBtn) sendLinkBtn.addEventListener('click', () => setState({ signinForm: false }));
            const enterPortalBtn = document.getElementById('enterPortalBtn');
            if (enterPortalBtn) enterPortalBtn.addEventListener('click', () => setState({ screen: 'dashboard' }));
            const backToFormLink = document.getElementById('backToFormLink');
            if (backToFormLink) backToFormLink.addEventListener('click', e => { e.preventDefault(); setState({ signinForm: true }); });
        }

        function bindPortalEvents() {
            document.querySelectorAll('.navItem').forEach(el => el.addEventListener('click', () => setState({ screen: el.dataset.nav })));

            const viewAllPrs = document.getElementById('viewAllPrs');
            if (viewAllPrs) viewAllPrs.addEventListener('click', e => { e.preventDefault(); setState({ screen: 'prlist' }); });

            document.querySelectorAll('.approveBtn').forEach(el => el.addEventListener('click', () => {
                state.approvals[el.dataset.id] = 'approved'; render();
            }));
            document.querySelectorAll('.rejectBtn').forEach(el => el.addEventListener('click', () => {
                state.approvals[el.dataset.id] = 'rejected'; render();
            }));

            const syncNowBtn = document.getElementById('syncNowBtn');
            if (syncNowBtn) syncNowBtn.addEventListener('click', () => {
                setState({ syncing: true });
                setTimeout(() => setState({ syncing: false }), 1200);
            });

            const dropZone = document.getElementById('dropZone');
            if (dropZone) dropZone.addEventListener('click', () => {
                setState({ uploadStep: 'uploading' });
                setTimeout(() => setState({ uploadStep: 'processing' }), 1000);
                setTimeout(() => setState({ uploadStep: 'review', lineItems: MOCK_LINES.map(l => ({ ...l })) }), 2400);
            });

            ['hdrPrNumber', 'hdrDate', 'hdrRequester', 'hdrDepartment', 'hdrVendor'].forEach(id => {
                const el = document.getElementById(id);
                if (el) el.addEventListener('input', e => {
                    const field = { hdrPrNumber: 'prNumber', hdrDate: 'date', hdrRequester: 'requester', hdrDepartment: 'department', hdrVendor: 'vendor' }[id];
                    state.header[field] = e.target.value;
                });
            });

            document.querySelectorAll('.descInput').forEach(el => el.addEventListener('input', e => {
                const li = state.lineItems.find(x => String(x.id) === el.dataset.id); if (li) li.description = e.target.value;
            }));

                const li = state.lineItems.find(x => String(x.id) === el.dataset.id); if (li) { li.qty = e.target.value; render(); }
            }));
            document.querySelectorAll('.uomInput').forEach(el => el.addEventListener('input', e => {
                const li = state.lineItems.find(x => String(x.id) === el.dataset.id); if (li) li.uom = e.target.value;

            if (addLineBtn) addLineBtn.addEventListener('click', e => {
                e.preventDefault();
                state.lineItems.push({ id: Date.now(), description: 'New line item', qty: '1', uom: 'EA', unitPrice: 0, confidence: 1 });
                render();
            });

            const discardBtn = document.getElementById('discardBtn');
            if (discardBtn) discardBtn.addEventListener('click', () => setState({ uploadStep: 'idle', lineItems: [] }));
            const submitPrBtn = document.getElementById('submitPrBtn');
            if (submitPrBtn) submitPrBtn.addEventListener('click', () => setState({ uploadStep: 'submitted' }));
            const uploadAnotherBtn = document.getElementById('uploadAnotherBtn');
            if (uploadAnotherBtn) uploadAnotherBtn.addEventListener('click', () => setState({ uploadStep: 'idle', lineItems: [] }));
        }

        render();
    </script>
</body>

</html>
